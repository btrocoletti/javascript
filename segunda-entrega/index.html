<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
        crossorigin="anonymous">

  <!-- CSS cheto -->
  <link rel="stylesheet" href="./style.css">

  <title>pet shop Bruno</title>

  <!-- JS con defer para no usar DOMContentLoaded -->
  <script defer src="./miniProyecto2.js"></script>
</head>

<body>
  <header class="app-header">
    <div class="container">
      <h1 class="app-title">pet shop Bruno</h1>
      <p class="app-subtitle">tienda online</p>
    </div>
  </header>

  <main class="container my-4">
    <section class="mb-4">
      <div class="d-flex align-items-end justify-content-between flex-wrap gap-3">
        <div>
          <h2 class="section-title">Productos</h2>
          <p class="section-hint">Elegí una categoría y agregá productos al carrito.</p>
        </div>

        <form class="form-filtro" id="formFiltro">
          <label class="form-label" for="tipoProducto">Filtrar por categoría</label>
          <select class="form-select" id="tipoProducto" aria-label="Filtro de productos">
            <option selected value="0">Todo</option>
            <option value="Medicinal">Medicinal</option>
            <option value="Juguete">Juguete</option>
            <option value="Alimento">Alimento</option>
          </select>
        </form>
      </div>

      <div class="row g-3 mt-2" id="contenedorProductos"></div>
    </section>

    <section class="carrito-section">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-2">
        <h2 class="section-title m-0">Carrito</h2>
        <p class="m-0" id="carritoTotal"></p>
      </div>

      <ul id="listaCarrito" class="carrito-lista"></ul>

      <form id="formCompraFinal" class="carrito-form">
        <div class="row g-2">
          <div class="col-12 col-md-4">
            <label class="form-label" for="nombre">Nombre</label>
            <input id="nombre" required type="text" name="nombre" class="form-control" placeholder="Tu nombre">
          </div>

          <div class="col-12 col-md-4">
            <label class="form-label" for="email">Email</label>
            <input id="email" required type="email" name="email" class="form-control" placeholder="tu@email.com">
          </div>

          <div class="col-12 col-md-4">
            <label class="form-label" for="telefono">Teléfono</label>
            <input id="telefono" required type="number" name="telefono" class="form-control" placeholder="Ej: 2804...">
          </div>
        </div>

        <div class="d-flex gap-2 align-items-center mt-3 flex-wrap">
          <input type="submit" value="Finalizar compra" class="btn btn-primary" id="botonCompraFinal">
          <button type="button" class="btn btn-outline-danger" id="btnVaciarCarrito">Vaciar carrito</button>
          <p class="m-0 carrito-msg" id="carritoMsg" aria-live="polite"></p>
        </div>
      </form>
    </section>
  </main>

  <footer class="app-footer">
    <div class="container">
      <small>Proyecto JS - Segunda entrega (DOM + Eventos + Storage)</small>
    </div>
  </footer>
</body>
</html>
